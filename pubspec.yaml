version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  connectivity_plus: ^5.0.2
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
