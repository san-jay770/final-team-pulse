<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Team Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
    <div id="pageContent">
        <div class="page-header">
            <div class="page-header-text">
                <h1>My Account Profile</h1>
                <p>Manage your account credentials, view workspace assignments, and update your password.</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <!-- Profile Info Card -->
            <div class="card">
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f1f5f9;">
                    <div class="avatar-circle" id="profileAvatar" style="width: 56px; height: 56px; font-size: 1.4rem;">U</div>
                    <div>
                        <h2 style="margin: 0; font-size: 1.2rem; color: var(--text-main);" id="profileName">...</h2>
                        <div style="font-size: 0.85rem; color: var(--text-muted);" id="profileEmail">...</div>
                        <div style="margin-top: 6px;"><span class="role-pill" id="profileRole">...</span></div>
                    </div>
                </div>

                <h3 style="font-size: 0.95rem; margin-bottom: 10px;">Assigned Workspaces</h3>
                <div id="profileWorkspacesList" style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="color: #64748b; font-size: 0.85rem;">Loading workspaces...</div>
                </div>
            </div>

            <!-- Password Change Card -->
            <div class="card">
                <h3 style="margin-top: 0; margin-bottom: 16px;">Update Password</h3>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" id="updatePassBtn" class="btn btn-primary" style="margin-top: 10px; width: 100%;">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await UI.initShell({ activeRoute: 'profile', pageTitle: 'Profile' });
        if (!currentUser) return;

        document.getElementById('profileName').textContent = currentUser.name;
        document.getElementById('profileEmail').textContent = currentUser.email;
        document.getElementById('profileAvatar').textContent = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U';
        document.getElementById('profileRole').textContent = currentUser.role.replace('_', ' ');
        document.getElementById('profileRole').className = `role-pill role-${currentUser.role.toLowerCase().replace('_', '-')}`;

        const workspacesList = document.getElementById('profileWorkspacesList');
        if (UI.userTeams && UI.userTeams.length > 0) {
            workspacesList.innerHTML = UI.userTeams.map(t => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <span style="font-weight: 600; font-size: 0.88rem; color: #1e293b;">${t.team_name}</span>
                    <span style="font-size: 0.75rem; color: #64748b;">${t.role.replace('_', ' ')}</span>
                </div>
            `).join('');
        } else {
            workspacesList.innerHTML = `<div style="color:#64748b; font-size:0.85rem;">No teams assigned.</div>`;
        }

        document.getElementById('passwordForm').onsubmit = handleUpdatePassword;
    });

    async function handleUpdatePassword(e) {
        e.preventDefault();
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;

        if (p1 !== p2) {
            UI.showToast('Passwords do not match.', 'danger');
            return;
        }

        const submitBtn = document.getElementById('updatePassBtn');
        submitBtn.disabled = true;

        const res = await API.resetPassword(currentUser.id, p1);
        submitBtn.disabled = false;

        if (res && res.success) {
            UI.showToast('Password updated successfully!', 'success');
            document.getElementById('passwordForm').reset();
        } else {
            UI.showToast(res.message || 'Failed to update password.', 'danger');
        }
    }
</script>
</body>
</html>
