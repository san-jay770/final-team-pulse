<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Team Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .export-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff !important;
            font-weight: 600;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
        }
        .export-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 767px) {
            .page-header-actions {
                flex-direction: column !important;
                width: 100% !important;
            }
            .page-header-actions button {
                width: 100% !important;
                justify-content: center !important;
            }
            #filterControls {
                width: 100% !important;
                flex-direction: column !important;
            }
            #filterControls input,
            #filterControls select {
                width: 100% !important;
            }
            div[style*="justify-content: space-between"] > div:first-child {
                width: 100% !important;
                display: flex !important;
                flex-direction: column !important;
                gap: 6px !important;
            }
            div[style*="justify-content: space-between"] > div:first-child button {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="pageContent">
        <div class="page-header">
            <div class="page-header-text">
                <h1>Performance & Task Reports</h1>
                <p>Generate daily breakdowns, weekly team comparisons, monthly milestones and export formatted Excel workbooks.</p>
            </div>
            <div class="page-header-actions">
                <button id="excelExportBtn" onclick="exportCurrentReport()" class="btn btn-sm export-btn">
                    <span>📊</span> Export to Excel (.xlsx)
                </button>
                <button onclick="window.print()" class="btn btn-secondary btn-sm">🖨 Print</button>
            </div>
        </div>

        <!-- Period Tabs & Filters -->
        <div style="display:flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:12px; margin-bottom:20px;">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="tabDaily" onclick="setReportTab('daily')" class="btn btn-primary btn-sm">Daily Report</button>
                <button id="tabWeekly" onclick="setReportTab('weekly')" class="btn btn-secondary btn-sm">Weekly Report</button>
                <button id="tabMonthly" onclick="setReportTab('monthly')" class="btn btn-secondary btn-sm">Monthly Report</button>
            </div>

            <!-- Optional Date / Filter controls -->
            <div id="filterControls" style="display: flex; gap: 10px; align-items: center;">
                <input type="date" id="reportDateInput" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onchange="loadReport()">
                <select id="teamFilterSelect" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.85rem; display: none;" onchange="loadReport()">
                    <option value="">All Teams</option>
                </select>
            </div>
        </div>

        <div id="reportContainer">
            <div class="card" style="text-align:center; padding:30px; color:#64748b;">Loading report data...</div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
    let currentTab = 'daily';
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await UI.initShell({ activeRoute: 'reports', allowedRoles: ['SUPER_ADMIN', 'ADMIN'], pageTitle: 'Reports' });
        if (!currentUser) return;

        // Set default date to today
        const todayStr = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('reportDateInput');
        if (dateInput) dateInput.value = todayStr;

        // If super admin, populate teams filter
        if (currentUser.role === 'SUPER_ADMIN') {
            const teamSelect = document.getElementById('teamFilterSelect');
            if (teamSelect) {
                teamSelect.style.display = 'block';
                const teamsRes = await API.getTeams();
                if (teamsRes && teamsRes.success && teamsRes.data) {
                    teamsRes.data.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = t.name;
                        teamSelect.appendChild(opt);
                    });
                }
            }
        }

        loadReport();
    });

    function setReportTab(tab) {
        currentTab = tab;
        ['daily', 'weekly', 'monthly'].forEach(t => {
            const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
            if (btn) btn.className = `btn btn-sm ${t === tab ? 'btn-primary' : 'btn-secondary'}`;
        });

        // Toggle date picker visibility based on tab
        const dateInput = document.getElementById('reportDateInput');
        if (dateInput) {
            dateInput.style.display = currentTab === 'daily' ? 'block' : 'none';
        }

        loadReport();
    }

    async function loadReport() {
        const container = document.getElementById('reportContainer');
        container.innerHTML = `<div class="card" style="text-align:center; padding:30px; color:#64748b;">Generating ${currentTab} report...</div>`;

        const params = {};
        const dateInput = document.getElementById('reportDateInput');
        const teamSelect = document.getElementById('teamFilterSelect');

        if (currentTab === 'daily' && dateInput && dateInput.value) {
            params.date = dateInput.value;
        }
        if (teamSelect && teamSelect.value) {
            params.team_id = teamSelect.value;
        }

        const res = await API.getReport(currentTab, params);
        if (res && res.success && res.data) {
            const d = res.data;

            if (currentTab === 'daily') {
                const s = d.stats;
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-header"><span class="stat-title">Created Today</span></div><div class="stat-value">${s.created}</div></div>
                        <div class="stat-card stat-green"><div class="stat-header"><span class="stat-title">Completed Today</span></div><div class="stat-value">${s.completed}</div></div>
                        <div class="stat-card stat-orange"><div class="stat-header"><span class="stat-title">Pending</span></div><div class="stat-value">${s.pending}</div></div>
                        <div class="stat-card stat-purple"><div class="stat-header"><span class="stat-title">Active Users</span></div><div class="stat-value">${s.active_users}</div></div>
                    </div>
                    <div class="card" style="margin-top:20px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h3 style="margin:0;">Today's Tasks (${d.date})</h3>
                            <button onclick="exportCurrentReport()" class="btn btn-sm export-btn" style="padding: 4px 10px; font-size: 0.8rem;">
                                📊 Export Tasks (.xlsx)
                            </button>
                        </div>
                        ${d.tasks && d.tasks.length > 0 ? `
                            <table class="table">
                                <thead><tr><th>Title</th><th>Team</th><th>Assigned</th><th>Status</th></tr></thead>
                                <tbody>
                                    ${d.tasks.map(t => `
                                        <tr>
                                            <td><strong>${t.title}</strong></td>
                                            <td>${t.team_name || '-'}</td>
                                            <td>${t.assigned_user_name || 'Unassigned'}</td>
                                            <td><span class="badge badge-${(t.status || 'pending').toLowerCase()}">${t.status}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<div style="color:#64748b; padding:10px 0;">No tasks created on this date.</div>'}
                    </div>
                `;
            } else if (currentTab === 'weekly') {
                container.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h3 style="margin:0;">Weekly Team Completion Breakdown</h3>
                            <button onclick="exportCurrentReport()" class="btn btn-sm export-btn" style="padding: 4px 10px; font-size: 0.8rem;">
                                📊 Export Weekly (.xlsx)
                            </button>
                        </div>
                        <table class="table">
                            <thead><tr><th>Team</th><th>Total Tasks</th><th>Completed</th><th>Progress</th></tr></thead>
                            <tbody>
                                ${(d.team_performance || []).map(t => `
                                    <tr>
                                        <td><strong>${t.name}</strong></td>
                                        <td>${t.total}</td>
                                        <td><span class="badge badge-completed">${t.completed}</span></td>
                                        <td>
                                            <div class="progress-container"><div class="progress-track"><div class="progress-fill" style="width:${t.pct}%;"></div></div></div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentTab === 'monthly') {
                const s = d.stats;
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-header"><span class="stat-title">Total Tasks</span></div><div class="stat-value">${s.total_tasks}</div></div>
                        <div class="stat-card stat-green"><div class="stat-header"><span class="stat-title">Completed</span></div><div class="stat-value">${s.completed_tasks}</div></div>
                        <div class="stat-card stat-orange"><div class="stat-header"><span class="stat-title">Pending</span></div><div class="stat-value">${s.pending_tasks}</div></div>
                        <div class="stat-card stat-purple"><div class="stat-header"><span class="stat-title">Period</span></div><div class="stat-value" style="font-size:1.2rem;">${d.period}</div></div>
                    </div>
                    <div class="card" style="margin-top:20px; text-align:right;">
                        <button onclick="exportCurrentReport()" class="btn btn-sm export-btn" style="padding: 6px 14px; font-size: 0.85rem;">
                            📊 Export Monthly Report (.xlsx)
                        </button>
                    </div>
                `;
            }
        }
    }

    async function exportCurrentReport() {
        const btn = document.getElementById('excelExportBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ Exporting...';
        btn.disabled = true;

        const params = {};
        const dateInput = document.getElementById('reportDateInput');
        const teamSelect = document.getElementById('teamFilterSelect');

        if (currentTab === 'daily' && dateInput && dateInput.value) {
            params.date = dateInput.value;
        }
        if (teamSelect && teamSelect.value) {
            params.team_id = teamSelect.value;
        }

        try {
            await API.exportReport(currentTab, params);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
