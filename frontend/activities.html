<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - Team Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
    <div id="pageContent">
        <div class="page-header">
            <div class="page-header-text">
                <h1>System Activity Log</h1>
                <p>Real-time audit trail of user logins, task lifecycle events, and administrative changes.</p>
            </div>
        </div>

        <div class="card">
            <div id="activitiesList" style="display: flex; flex-direction: column; gap: 12px;">
                <div style="text-align: center; color: #64748b; padding: 30px;">Loading audit logs...</div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = await UI.initShell({ activeRoute: 'activities', allowedRoles: ['SUPER_ADMIN', 'ADMIN', 'TEAM_MEMBER'], pageTitle: 'Activities' });
        if (!user) return;

        const res = await API.getActivities();
        const container = document.getElementById('activitiesList');

        if (res && res.success && res.data) {
            const list = res.data;
            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#64748b; padding:30px;">No activities recorded yet.</div>`;
                return;
            }

            container.innerHTML = list.map(a => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div>
                        <strong style="color: var(--text-main); font-size: 0.92rem;">${a.activity}</strong>
                        ${a.description ? `<div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">${a.description}</div>` : ''}
                    </div>
                    <span style="font-size: 0.78rem; color: #94a3b8; white-space: nowrap;">${a.created_at ? new Date(a.created_at.replace(' ', 'T')).toLocaleString() : ''}</span>
                </div>
            `).join('');
        }
    });
</script>
</body>
</html>
